<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocket Focus</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <audio id="music" loop>
        <source src="Itai Argaman - Decision Making.mp3" type="audio/mpeg">
    </audio>

   



    <audio  id="bell1" preload="auto" src="alarm_QenbR8T.mp3"></audio>
    <audio  id="bell2" preload="auto" src="alarma-de-auron-play.mp3"></audio>
    <audio  id="bell3" preload="auto" src="alarma-saturada.mp3"></audio>
    <audio  id="bell4" preload="auto" src="c418-stranger-think.mp3"></audio>
    <audio  id="bell5" preload="auto" src="cat-alarm.mp3"></audio>
    <audio  id="bell6" preload="auto" src="danger-alarm-sound-effect-meme.mp3"></audio>
    <audio  id="bell7" preload="auto" src="hangouts-incoming-call.mp3"></audio>
    <audio  id="bell8" preload="auto" src="iphone-classic-alarm.mp3"></audio>
    <audio  id="bell9" preload="auto" src="nuclear-alarm-siren.mp3"></audio>
    <audio  id="bell10" preload="auto" src="samsung-galaxy-morning-flower.mp3"></audio>
 



    <div class="container">
        <h1 class="title">Rocket Focus 🚀</h1>

        <hr>

        <p class="timer" id="timer">0:00</p>

        <div class="progress">

            <span class="planet">🌎</span>

            <div class="track">
                <span class="rocket">🚀</span>
            </div>

            <div class="moon-container">
                <span class="moon">🌕</span>
            </div>
            
        </div>

        <div class="buttons">

            <input type="number" id="minutes" min="1" placeholder="Tiempo">
        <button id="set-time">Establecer tiempo</button>

        <div class="btn-wrapper">

            <button id="start">Start</button>
            <button id="stop">Stop</button>
            <button id="reset">Reset</button>

        </div>

        </div>
        
    </div>
    

    <script src="script.js"></script>
</body>
</html>
